<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scapu — Opinion Card Generator</title>
<style>
  :root{
    --bg:#0a0a0a;
    --panel:#141414;
    --panel-2:#1c1c1c;
    --line:#2a2a2a;
    --yellow:#F5E11D;
    --green:#34D17C;
    --red:#FF4D5E;
    --text:#ffffff;
    --muted:#8e8e93;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    padding:20px 16px 48px;
  }
  h1{
    font-size:20px;
    font-weight:800;
    letter-spacing:-0.01em;
    margin:0 0 2px;
  }
  .sub{
    color:var(--muted);
    font-size:13px;
    margin:0 0 20px;
  }
  .preview-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:20px;
  }
  canvas{
    width:100%;
    max-width:340px;
    height:auto;
    border-radius:18px;
    border:1px solid var(--line);
    display:block;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
  }
  .panel-title{
    font-size:11px;
    font-weight:800;
    letter-spacing:0.08em;
    color:var(--muted);
    text-transform:uppercase;
    margin:0 0 12px;
  }
  label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin:0 0 6px;
    font-weight:600;
  }
  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  input[type=text], textarea{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:10px;
    padding:10px 12px;
    font-size:14px;
    font-family:inherit;
    resize:none;
  }
  textarea{min-height:64px;}
  input[type=text]:focus, textarea:focus{outline:1px solid var(--yellow);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .pillrow{display:flex;gap:8px;}
  .pillbtn{
    flex:1;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--muted);
    border-radius:10px;
    padding:10px;
    font-size:13px;
    font-weight:700;
    text-align:center;
    cursor:pointer;
  }
  .pillbtn.active{
    background:var(--yellow);
    color:#000;
    border-color:var(--yellow);
  }
  .check-row{
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
  }
  .check-row input{accent-color:var(--yellow);width:16px;height:16px;}
  .check-row span{font-size:13px;color:var(--text);font-weight:600;}
  .avatar-row{display:flex;align-items:center;gap:10px;}
  .avatar-preview{
    width:36px;height:36px;border-radius:50%;
    background:var(--panel-2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;flex-shrink:0;font-size:13px;font-weight:800;
  }
  .avatar-preview img{width:100%;height:100%;object-fit:cover;}
  input[type=color]{
    -webkit-appearance:none;
    appearance:none;
    width:44px;
    height:36px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--panel-2);
    padding:2px;
    cursor:pointer;
    flex-shrink:0;
  }
  input[type=color]::-webkit-color-swatch-wrapper{padding:0;}
  input[type=color]::-webkit-color-swatch{border:none;border-radius:6px;}
  .hexLabel{
    font-size:13px;
    color:var(--muted);
    font-weight:600;
    text-transform:uppercase;
  }
  .switch-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
  }
  .switch-label{font-size:14px;font-weight:700;color:var(--text);}
  .switch{
    position:relative;
    display:inline-block;
    width:52px;
    height:30px;
    flex-shrink:0;
  }
  .switch input{
    opacity:0;
    width:0;
    height:0;
  }
  .switch-slider{
    position:absolute;
    inset:0;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:30px;
    transition:background 0.2s ease;
  }
  .switch-slider::before{
    content:"";
    position:absolute;
    width:22px;
    height:22px;
    left:3px;
    top:3px;
    background:#fff;
    border-radius:50%;
    transition:transform 0.2s ease;
  }
  .switch input:checked + .switch-slider{
    background:var(--yellow);
    border-color:var(--yellow);
  }
  .switch input:checked + .switch-slider::before{
    transform:translateX(22px);
    background:#000;
  }
  .filebtn{
    flex:1;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:10px;
    padding:9px 12px;
    font-size:13px;
    font-weight:600;
    text-align:center;
    cursor:pointer;
    position:relative;
    overflow:hidden;
  }
  .filebtn input{
    position:absolute;inset:0;opacity:0;cursor:pointer;
  }
  .clearbtn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    border-radius:10px;
    padding:9px 12px;
    font-size:13px;
    cursor:pointer;
  }
  .actions{
    display:flex;
    gap:10px;
    margin-top:4px;
  }
  .btn{
    flex:1;
    border:none;
    border-radius:12px;
    padding:14px;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
  }
  .btn-primary{background:var(--yellow);color:#000;}
  .btn-secondary{background:var(--panel-2);color:var(--text);border:1px solid var(--line);}
  .btn:active{transform:scale(0.98);}
  #shareBtn{display:none;}
</style>
</head>
<body>

<h1>Opinion Card Generator</h1>
<p class="sub">Build a shareable result card from any Opinion Bar™ post.</p>

<div class="preview-wrap">
  <canvas id="cardCanvas"></canvas>
</div>

<div class="panel">
  <p class="panel-title">Format</p>
  <div class="pillrow">
    <div class="pillbtn active" data-format="story">Story · 9:16</div>
    <div class="pillbtn" data-format="post">Feed · 4:5</div>
  </div>
</div>

<div class="panel">
  <p class="panel-title">Theme</p>
  <label class="switch-row" for="themeToggle">
    <span class="switch-label" id="themeLabel">Dark mode</span>
    <span class="switch">
      <input type="checkbox" id="themeToggle">
      <span class="switch-slider"></span>
    </span>
  </label>
</div>

<div class="panel">
  <p class="panel-title">Author</p>
  <div class="field avatar-row">
    <div class="avatar-preview" id="avatarPreview">D</div>
    <div class="filebtn">Upload photo<input type="file" id="avatarInput" accept="image/*"></div>
    <button class="clearbtn" id="clearAvatar">Clear</button>
  </div>
  <div class="field">
    <label>Name</label>
    <input type="text" id="authorName" value="David Ayo">
  </div>
  <div class="row2">
    <div class="field">
      <label>Posted</label>
      <input type="text" id="timestamp" value="4 days ago">
    </div>
  </div>
  <div class="check-row" id="verifiedRow">
    <input type="checkbox" id="verified" checked>
    <span>Verified badge</span>
  </div>
</div>

<div class="panel">
  <p class="panel-title">Category</p>
  <div class="row2">
    <div class="field">
      <label>Content</label>
      <input type="text" id="category" value="Pub">
    </div>
    <div class="field">
      <label>Border color</label>
      <div class="avatar-row">
        <input type="color" id="categoryColor" value="#F5E11D">
        <span class="hexLabel" id="categoryColorHex">#F5E11D</span>
      </div>
    </div>
  </div>
</div>

<div class="panel">
  <p class="panel-title">Opinion</p>
  <div class="field">
    <label>Question</label>
    <textarea id="question">Who do you think will win the World Cup</textarea>
  </div>
  <div class="row2">
    <div class="field">
      <label>Agree votes</label>
      <input type="text" id="agreeVotes" value="33500" inputmode="numeric">
    </div>
    <div class="field">
      <label>Disagree votes</label>
      <input type="text" id="disagreeVotes" value="16500" inputmode="numeric">
    </div>
  </div>
</div>

<div class="panel">
  <p class="panel-title">Brand font (optional)</p>
  <div class="field avatar-row">
    <div class="filebtn">Upload Mokoto (.ttf/.otf)<input type="file" id="fontInput" accept=".ttf,.otf,.woff,.woff2"></div>
    <button class="clearbtn" id="clearFont">Clear</button>
  </div>
</div>

<div class="actions">
  <button class="btn btn-secondary" id="shareBtn">Share</button>
  <button class="btn btn-primary" id="downloadBtn">Download PNG</button>
</div>

<script>
const canvas = document.getElementById('cardCanvas');
const ctx = canvas.getContext('2d');

const FORMATS = {
  story: { w: 1080, h: 1920 },

};

  dark: { bg: '#0a0a0a', text: '#ffffff', muted: '#8e8e93', line: '#2a2a2a', emptyBar: '#2a2a2a' },

document.getElementById('themeToggle').addEventListener('change', (e) => {
  currentTheme = e.target.checked ? 'light' : 'dark';

  draw();
});

const logoImg = new Image();
let logoReady = false;
logoImg.onload = () => { logoReady = true; draw(); };
logoImg.src = LOGO_SRC;

const els = {
  authorName: document.getElementById('authorName'),
  timestamp: document.getElementById('timestamp'),
  category: document.getElementById('category'),
  categoryColor: document.getElementById('categoryColor'),
  verified: document.getElementById('verified'),
  question: document.getElementById('question'),
  agreeVotes: document.getElementById('agreeVotes'),
  disagreeVotes: document.getElementById('disagreeVotes'),
};

Object.values(els).forEach(el => el.addEventListener('input', draw));
els.categoryColor.addEventListener('input', () => {
  document.getElementById('categoryColorHex').textContent = els.categoryColor.value.toUpperCase();
});
document.querySelectorAll('.pillbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.pillbtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFormat = btn.dataset.format;
    draw();
  });
});

document.getElementById('avatarInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      avatarImg = img;
      const prev = document.getElementById('avatarPreview');
      prev.innerHTML = '';
      const imgEl = document.createElement('img');
      imgEl.src = ev.target.result;
      prev.appendChild(imgEl);
      draw();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

document.getElementById('clearAvatar').addEventListener('click', () => {
  avatarImg = null;
  document.getElementById('avatarPreview').innerHTML = (els.authorName.value.trim()[0] || '?').toUpperCase();
  draw();
});

let loadedBrandFont = null;
document.getElementById('fontInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const buffer = await file.arrayBuffer();
    const font = new FontFace('Mokoto', buffer);
    await font.load();
    document.fonts.add(font);
    loadedBrandFont = font;
    draw();
  } catch (err) {
    console.error('Could not load font:', err);
  }
});

document.getElementById('clearFont').addEventListener('click', () => {
  if (loadedBrandFont) {
    document.fonts.delete(loadedBrandFont);
    loadedBrandFont = null;
  }
  document.getElementById('fontInput').value = '';
  draw();
});

// ---- drawing helpers ----
function roundRectPath(c, x, y, w, h, r) {
  if (typeof r === 'number') r = {tl:r, tr:r, br:r, bl:r};
  const max = Math.min(w, h) / 2;
  r = {
    tl: Math.min(r.tl, max),
    tr: Math.min(r.tr, max),
    br: Math.min(r.br, max),
    bl: Math.min(r.bl, max),
  };
  c.beginPath();
  c.moveTo(x + r.tl, y);
  c.lineTo(x + w - r.tr, y);
  c.arcTo(x + w, y, x + w, y + r.tr, r.tr);
  c.lineTo(x + w, y + h - r.br);
  c.arcTo(x + w, y + h, x + w - r.br, y + h, r.br);
  c.lineTo(x + r.bl, y + h);
  c.arcTo(x, y + h, x, y + h - r.bl, r.bl);
  c.lineTo(x, y + r.tl);
  c.arcTo(x, y, x + r.tl, y, r.tl);
  c.closePath();
}

function wrapText(c, text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '';
  let curY = y;
  const lines = [];
  for (let n = 0; n < words.length; n++) {
    const testLine = line + words[n] + ' ';
    if (c.measureText(testLine).width > maxWidth && line !== '') {
      lines.push(line.trim());
      line = words[n] + ' ';
    } else {
      line = testLine;
    }
  }
  lines.push(line.trim());
  lines.forEach((l, i) => c.fillText(l, x, curY + i * lineHeight));
  return curY + lines.length * lineHeight;
}

function trackedText(c, text, x, y, spacing) {
  let curX = x;
  for (const ch of text) {
    c.fillText(ch, curX, y);
    curX += c.measureText(ch).width + spacing;
  }
  return curX;
}

function trackedTextWidth(c, text, spacing) {
  let total = 0;
  for (const ch of text) total += c.measureText(ch).width + spacing;
  return total - spacing;
}

function trackedTextCentered(c, text, centerX, y, spacing) {
  const total = trackedTextWidth(c, text, spacing);
  trackedText(c, text, centerX - total / 2, y, spacing);
}

function avatarColor(name) {
  const palette = ['#F5E11D', '#34D17C', '#5B9BFF', '#C77DFF', '#FF9F45'];
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return palette[Math.abs(hash) % palette.length];
}

function categoryColor(cat) {
  const key = (cat || '').trim().toLowerCase();
  const map = {
    pub: '#F5E11D',
    sports: '#F5E11D',
    football: '#F5E11D',
    entertainment: '#FF4FA3',
    music: '#FF4FA3',
    'hip hop': '#FF4FA3',
    politics: '#5B9BFF',
    tech: '#5B9BFF',
    business: '#5B9BFF',
  };
  return map[key] || '#F5E11D';
}

function formatVoteCount(n) {
  if (n >= 1000000) {
    const v = n / 1000000;
    return (Number.isInteger(v) ? v : v.toFixed(1)) + 'M';
  }
  if (n >= 1000) {
    const v = n / 1000;
    return (Number.isInteger(v) ? v : v.toFixed(1)) + 'K';
  }
  return String(n);
}

const appStoreImg = new Image();
const playStoreImg = new Image();
let appStoreReady = false, playStoreReady = false;
appStoreImg.onload = () => { appStoreReady = true; draw(); };
playStoreImg.onload = () => { playStoreReady = true; draw(); };
appStoreImg.src = APP_STORE_SRC;
playStoreImg.src = PLAY_STORE_SRC;

function drawOfficialBadges(ctx, margin, footerY, w) {
  // Official badge SVGs: App Store (119.66 × 40 ratio), Google Play (238.96 × 70.87 ratio)
  // Both scaled to same display height for visual consistency
  const badgeH = 110;
  const gap = 24;
  const badgeW = (w - margin * 2 - gap) / 2;
  const badgeY = footerY + 44;

  // App Store badge — original ratio 119.66:40 = 2.99:1
  if (appStoreReady) {
    const aW = badgeH * (119.66 / 40);
    const aX = margin + (badgeW - aW) / 2;
    ctx.drawImage(appStoreImg, aX, badgeY, aW, badgeH);
  }
  // Google Play badge — original ratio 238.96:70.87 = 3.37:1
  if (playStoreReady) {
    const pW = badgeH * (238.96 / 70.87);
    const pX = margin + badgeW + gap + (badgeW - pW) / 2;
    ctx.drawImage(playStoreImg, pX, badgeY, pW, badgeH);
  }
}

function draw() {
  const { w, h } = FORMATS[currentFormat];
  canvas.width = w;
  canvas.height = h;

  const margin = 84;
  const theme = THEMES[currentTheme];

  // background
  ctx.fillStyle = theme.bg;
  ctx.fillRect(0, 0, w, h);

  let y = 150;

  // top bar: wordmark + opinion pill
  const logoH = 48;
  const logoW = logoReady ? logoH * (logoImg.width / logoImg.height) : logoH * 0.747;
  if (logoReady) {
    ctx.drawImage(logoImg, margin, y - 38, logoW, logoH);
  }

  ctx.fillStyle = theme.text;
  ctx.font = '800 34px -apple-system, system-ui, sans-serif';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('Opinion Bar', margin + logoW + 20, y);
  const wmWidth = ctx.measureText('Opinion Bar').width;
  ctx.font = '700 16px -apple-system, system-ui, sans-serif';
  ctx.fillText('™', margin + logoW + 20 + wmWidth + 4, y - 14);
  const wmEndX = margin + logoW + 20 + wmWidth + 4 + ctx.measureText('™').width;

  // OPINION pill, right aligned
  ctx.font = '800 22px -apple-system, system-ui, sans-serif';
  const pillLabel = 'OPINION';
  const pillTextW = ctx.measureText(pillLabel).width;
  const pillW = pillTextW + 44;
  const pillH = 50;
  const pillX = w - margin - pillW;
  const pillY = y - 36;
  ctx.fillStyle = '#F5E11D';
  roundRectPath(ctx, pillX, pillY, pillW, pillH, 25);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.textBaseline = 'middle';
  ctx.fillText(pillLabel, pillX + 22, pillY + pillH / 2 + 1);
  ctx.textBaseline = 'alphabetic';


  // SCAPU wordmark, centered on the header
  ctx.fillStyle = theme.text;
  ctx.font = '800 45px "Mokoto", -apple-system, system-ui, sans-serif';
  trackedTextCentered(ctx, 'SCAPU', w / 2, y + 8, 3);

  y += 130;

  // author row
  const avatarSize = 84;
  const avatarX = margin;
  const avatarY = y;
  ctx.save();
  ctx.beginPath();
  ctx.arc(avatarX + avatarSize / 2, avatarY + avatarSize / 2, avatarSize / 2, 0, Math.PI * 2);
  ctx.closePath();
  ctx.clip();
  if (avatarImg) {
    const size = Math.min(avatarImg.width, avatarImg.height);
    const sx = (avatarImg.width - size) / 2;
    const sy = (avatarImg.height - size) / 2;
    ctx.drawImage(avatarImg, sx, sy, size, size, avatarX, avatarY, avatarSize, avatarSize);
  } else {
    const name = els.authorName.value.trim() || '?';
    ctx.fillStyle = avatarColor(name);
    ctx.fillRect(avatarX, avatarY, avatarSize, avatarSize);
    ctx.fillStyle = '#000';
    ctx.font = '800 34px -apple-system, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(name[0].toUpperCase(), avatarX + avatarSize / 2, avatarY + avatarSize / 2 + 2);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }
  ctx.restore();

  const nameX = avatarX + avatarSize + 24;
  ctx.fillStyle = theme.text;
  ctx.font = '800 36px -apple-system, system-ui, sans-serif';
  const nameText = els.authorName.value || 'Anonymous';
  ctx.fillText(nameText, nameX, avatarY + 36);

  if (els.verified.checked) {
    const nameW = ctx.measureText(nameText).width;
    const bx = nameX + nameW + 16;
    const by = avatarY + 22;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(bx, by, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = theme.line;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(bx - 6, by);
    ctx.lineTo(bx - 2, by + 5);
    ctx.lineTo(bx + 7, by - 7);
    ctx.stroke();
  }

  ctx.fillStyle = theme.muted;
  ctx.font = '500 26px -apple-system, system-ui, sans-serif';
  ctx.fillText(els.timestamp.value || '', nameX, avatarY + 70);

  y = avatarY + avatarSize + 80;

  // question
  ctx.fillStyle = theme.text;
  ctx.font = '800 58px -apple-system, system-ui, sans-serif';
  const qText = els.question.value || 'Untitled opinion';
  y = wrapText(ctx, qText, margin, y, w - margin * 2, 70) + 10;

  // category tag, beneath the caption
  const catText = (els.category.value || '').toUpperCase();
  if (catText) {
    y += 30;
    const tagColor = els.categoryColor.value || categoryColor(els.category.value);
    ctx.font = '800 26px -apple-system, system-ui, sans-serif';
    const ctW = ctx.measureText(catText).width;
    const chipW = ctW + 48;
    const chipH = 56;
    ctx.strokeStyle = tagColor;
    ctx.lineWidth = 2.5;
    roundRectPath(ctx, margin, y, chipW, chipH, 12);
    ctx.stroke();
    ctx.fillStyle = tagColor;
    ctx.textBaseline = 'middle';
    ctx.fillText(catText, margin + 24, y + chipH / 2 + 2);
    ctx.textBaseline = 'alphabetic';
    y += chipH;
  }

  y += 50;

  // votes label
  const agree = Math.max(0, parseInt(els.agreeVotes.value) || 0);
  const disagree = Math.max(0, parseInt(els.disagreeVotes.value) || 0);
  const total = agree + disagree;

  ctx.fillStyle = theme.text;
  ctx.font = '800 28px -apple-system, system-ui, sans-serif';
  trackedText(ctx, total > 0 ? `${formatVoteCount(total)} VOTES` : 'BE THE FIRST TO VOTE', margin, y, 1.5);

  y += 36;

  // vote bar
  const barH = 96;
  const barW = w - margin * 2;
  const agreePct = total > 0 ? agree / total : 0.5;
  const disagreePct = 1 - agreePct;

  ctx.save();
  roundRectPath(ctx, margin, y, barW, barH, barH / 2);
  ctx.clip();
  if (total > 0) {
    ctx.fillStyle = '#34D17C';
    ctx.fillRect(margin, y, barW * agreePct, barH);
    ctx.fillStyle = '#FF4D5E';
    ctx.fillRect(margin + barW * agreePct, y, barW * disagreePct, barH);
  } else {
    ctx.fillStyle = theme.emptyBar;
    ctx.fillRect(margin, y, barW, barH);
  }
  ctx.restore();

  if (total > 0) {
    ctx.font = '800 32px -apple-system, system-ui, sans-serif';
    ctx.textBaseline = 'middle';
    if (agreePct > 0.16) {
      ctx.fillStyle = '#06200f';
      ctx.fillText(Math.round(agreePct * 100) + '%', margin + 24, y + barH / 2 + 2);
    }
    if (disagreePct > 0.16) {
      const txt = Math.round(disagreePct * 100) + '%';
      const tw = ctx.measureText(txt).width;
      ctx.fillStyle = '#2b0608';
      ctx.fillText(txt, margin + barW - tw - 24, y + barH / 2 + 2);
    }
    ctx.textBaseline = 'alphabetic';
  }

  y += barH + 44;

  // footer pinned to bottom
  const footerY = h - 260;
  ctx.strokeStyle = theme.line;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(margin, footerY - 40);
  ctx.lineTo(w - margin, footerY - 40);
  ctx.stroke();

  const fLogoH = 34;
  const fLogoW = logoReady ? fLogoH * (logoImg.width / logoImg.height) : fLogoH * 0.747;
  if (logoReady) {
    ctx.drawImage(logoImg, margin, footerY - 6, fLogoW, fLogoH);
  }

  ctx.fillStyle = theme.text;
  ctx.font = '800 26px -apple-system, system-ui, sans-serif';
  ctx.fillText('Scapu', margin + fLogoW + 14, footerY + 16);
  ctx.fillStyle = theme.muted;
  ctx.font = '500 24px -apple-system, system-ui, sans-serif';
  const cta = 'Cast your vote → scapu.app';
  const ctaW = ctx.measureText(cta).width;
  ctx.fillText(cta, w - margin - ctaW, footerY + 16);

  // Store badges (official SVGs)
  drawOfficialBadges(ctx, margin, footerY, w);
}

// ---- export ----
document.getElementById('downloadBtn').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'scapu-opinion-card.png';
  link.href = canvas.toDataURL('image/png', 1.0);
  link.click();
});

const shareBtn = document.getElementById('shareBtn');
if (navigator.canShare) {
  shareBtn.style.display = 'block';
  shareBtn.addEventListener('click', async () => {
    canvas.toBlob(async (blob) => {
      const file = new File([blob], 'scapu-opinion-card.png', { type: 'image/png' });
      if (navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: 'Opinion Bar', text: els.question.value });
        } catch (e) {}
      }
    }, 'image/png', 1.0);
  });
}

draw();
</script>
</body>
</html>
